name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # the dev toolchain (vitest, tsup) needs Node 22.12+; published packages run on Node 20+ (see smoke step)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and AST conformance tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test the built packages
        run: node scripts/smoke.mjs

      - name: Switch to Node 20 (the supported runtime floor for the published packages)
        if: matrix.node == 22
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Smoke-test the built packages on Node 20
        if: matrix.node == 22
        run: node scripts/smoke.mjs
