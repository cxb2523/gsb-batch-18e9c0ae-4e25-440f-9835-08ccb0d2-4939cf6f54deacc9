name: Bug report
description: Something is broken, or the parser/writer mishandled a file
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems do **not** use this form; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest `.tsx` (or steps) that shows it. Only share code you have the right to share.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prismbox version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node.js version, package manager, React / three / @react-three/fiber versions
    validations:
      required: true
