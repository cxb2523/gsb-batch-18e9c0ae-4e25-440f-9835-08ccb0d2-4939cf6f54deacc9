name: Hero template submission
description: Propose a hero template for the template kit
labels: ["template"]
body:
  - type: markdown
    attributes:
      value: |
        The template kit is not live yet. Proposals are welcome now so the format can be shaped by real submissions. A template is a single plain `.tsx` file inside the supported subset (see docs/subset.md), with its own `<Canvas camera={...}>`.
  - type: input
    id: name
    attributes:
      label: Template name
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it look like and do?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source or link
      description: Paste the `.tsx`, or link to a gist or repo.
      render: tsx
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Checklist
      options:
        - label: I wrote this template myself, or I have the right to contribute it under the MIT License.
          required: true
        - label: It uses only allowed imports (react, three, @react-three/fiber, @react-three/drei, relative files).
          required: true
